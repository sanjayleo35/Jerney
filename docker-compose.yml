services:
  # ---- PostgreSQL Database ----
  db:
    image: postgres:16-alpine
    container_name: jerney-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-jerney_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jerney_pass_2026}
      POSTGRES_DB: ${DB_NAME:-jerney_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-jerney_user} -d ${DB_NAME:-jerney_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Security: read-only root filesystem where possible
    tmpfs:
      - /tmp
      - /run

  # ---- Database Migration ----
  db-migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jerney-db-migrate
    command: ["node", "src/migrate.js"]
    environment:
      DB_USER: ${DB_USER:-jerney_user}
      DB_PASSWORD: ${DB_PASSWORD:-jerney_pass_2026}
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-jerney_db}
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  # ---- Backend API ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jerney-backend
    restart: unless-stopped
    environment:
      PORT: "${PORT:-5000}"
      DB_USER: ${DB_USER:-jerney_user}
      DB_PASSWORD: ${DB_PASSWORD:-jerney_pass_2026}
      DB_HOST: db
      DB_PORT: "${DB_PORT:-5432}"
      DB_NAME: ${DB_NAME:-jerney_db}
    expose:
      - "5000"
    depends_on:
      db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    # Security: do not run as root (already in Dockerfile, but enforced here too)
    security_opt:
      - no-new-privileges:true

  # ---- Frontend (Nginx + React) ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jerney-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
    driver: local
