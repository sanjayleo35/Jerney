# ==============================================================
# Database Secret Example
# In production, inject secrets via External Secrets Operator (AWS Secrets Manager / Vault),
# Sealed Secrets, or CI/CD secret substitution prior to deployment.
# Values below are base64-encoded dummy placeholders:
#   POSTGRES_USER: "jerney_user" -> amVybmV5X3VzZXI=
#   POSTGRES_PASSWORD: "CHANGE_ME_PASSWORD" -> Q0hBTkdFX01FX1BBU1NXT1JE
#   POSTGRES_DB: "jerney_db" -> amVybmV5X2Ri
# ==============================================================
apiVersion: v1
kind: Secret
metadata:
  name: jerney-db-secret
  namespace: jerney
  labels:
    app.kubernetes.io/part-of: jerney
type: Opaque
data:
  POSTGRES_USER: amVybmV5X3VzZXI=
  POSTGRES_PASSWORD: Q0hBTkdFX01FX1BBU1NXT1JE
  POSTGRES_DB: amVybmV5X2Ri
