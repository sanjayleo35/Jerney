name: Jerney DevSecOps Pipeline

on:
  push:
    branches:
      - devops
  pull_request:
    branches:
      - devops

env:
  GHCR_REGISTRY: ghcr.io
  FRONTEND_IMAGE: ghcr.io/sanjayleo35/jerney-frontend
  BACKEND_IMAGE: ghcr.io/sanjayleo35/jerney-backend

permissions:
  contents: write
  packages: write

jobs:
  test-and-code-quality:
    name: Test and Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GHCR_PAT }}
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install and audit backend dependencies
        working-directory: ./backend
        run: |
          npm ci
          npm audit --audit-level=critical

      - name: Install and audit frontend dependencies
        working-directory: ./frontend
        run: |
          npm ci
          npm audit --audit-level=critical

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=sanjayleo35_Jerney
            -Dsonar.organization=sanjayleo35

      - name: Checkov scan on Terraform
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          config_file: .checkov.yml

  build-and-security-scan:
    name: Build and Security Scan
    runs-on: ubuntu-latest
    needs: test-and-code-quality
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GHCR_PAT }}
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build backend image
        run: docker build -t "${BACKEND_IMAGE}:${GITHUB_SHA}" ./backend

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Build frontend image
        run: docker build -t "${FRONTEND_IMAGE}:${GITHUB_SHA}" ./frontend

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Tag images for GHCR
        if: github.event_name == 'push'
        run: |
          docker tag "${BACKEND_IMAGE}:${GITHUB_SHA}" "${BACKEND_IMAGE}:latest"
          docker tag "${FRONTEND_IMAGE}:${GITHUB_SHA}" "${FRONTEND_IMAGE}:latest"

      - name: Push images to GHCR
        if: github.event_name == 'push'
        run: |
          docker push "${BACKEND_IMAGE}:${GITHUB_SHA}"
          docker push "${BACKEND_IMAGE}:latest"
          docker push "${FRONTEND_IMAGE}:${GITHUB_SHA}"
          docker push "${FRONTEND_IMAGE}:latest"

      - name: Update Kubernetes Manifests with New Image Tag
        if: github.event_name == 'push'
        run: |
          sed -i -E "s|ghcr.io/sanjayleo35/jerney-backend:.*|ghcr.io/sanjayleo35/jerney-backend:${{ github.sha }}|" k8s/backend-deployment.yaml
          sed -i -E "s|ghcr.io/sanjayleo35/jerney-frontend:.*|ghcr.io/sanjayleo35/jerney-frontend:${{ github.sha }}|" k8s/frontend-deployment.yaml

      - name: Commit updated Kubernetes manifests
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          repository: .
          token: ${{ secrets.GHCR_PAT }}
          commit_message: "gitops: update k8s image tags to ${{ github.sha }} [skip ci]"
          branch: devops
          file_pattern: k8s/backend-deployment.yaml k8s/frontend-deployment.yaml